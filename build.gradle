plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenLocal()

    maven { url = "https://api.modrinth.com/maven"}
    maven { url = "https://cursemaven.com" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.blamejared.com" }
    maven {
        name "CaffeineMC"
        url "https://maven.caffeinemc.net/releases" // or /snapshots
    }
    flatDir {
        dir("libs")
    }
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def generatedResources = layout.buildDirectory.dir("generated/sources/modMetadata")

tasks.register("generateModMetadata", ProcessResources) {
    def props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties(props)

    expand(props)

    from("src/main/templates")
    into(generatedResources)
}

sourceSets.main.resources.srcDir(generatedResources)

tasks.named("processResources") {
    dependsOn("generateModMetadata")
}

neoForge.ideSyncTask tasks.named("generateModMetadata")



dependencies {
    // NeoForge's Minecraft dependency already ships ICU4J; keep this compile-only
    // so the mixin links against the same runtime copy without embedding the full jar.
    compileOnly "com.ibm.icu:icu4j:73.2"

    // Plain libraries: no standalone mod jar exists for these, so they stay on Maven.
    compileOnlyApi "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnlyApi "io.github.ocelot:glsl-processor:0.2.3"

    // Mods that are in neither libs/ nor the modpack instance.
    compileOnly "maven.modrinth:optitritium:vGs5rSd0"
    compileOnly "maven.modrinth:rrls:5.0.10+mc1.21.1-forge"
    compileOnly "maven.modrinth:raritycore:1211.13.1"

    // Everything else is compiled against the local jars, which are kept in sync with
    // the modpack instance under .minecraft/versions/<profile>/mods (see libs/README.md).
    compileOnly fileTree(dir: 'libs/compileOnly', include: ['*.jar'])

    runtimeOnly fileTree(dir: 'libs/runtimeOnly', include: ['*.jar'])

    implementation fileTree(dir: 'libs/implementation', include: ['*.jar'])
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}
kotlin {
    jvmToolchain(21)
}

apply from: rootProject.file('gradle/publish-platforms.gradle')
