// ============================================================================
// 发布到 CurseForge / Modrinth 的复用任务
//
// 凭证来源：环境变量优先，其次仓库根目录的 publish-credentials.properties
//   CURSEFORGE_API_KEY     / curseforge_api_key
//   CURSEFORGE_PROJECT_ID  / curseforge_project_id   （默认 1697081）
//   MODRINTH_TOKEN         / modrinth_token
//   MODRINTH_PROJECT_ID    / modrinth_project_id     （留空则按 slug 自动匹配）
//   MODRINTH_PROJECT_SLUG  / modrinth_project_slug   （默认 goldentweaks）
//
// 用法：
//   gradlew publishPlatforms     同时上传两个平台
//   gradlew publishModrinth      只传 Modrinth
//   gradlew publishCurseForge    只传 CurseForge
//   gradlew modrinthProjects     列出 token 账号下的项目（用于查找草稿项目的 ID）
//
// 上传的 jar 取自 jar 任务的产物，更新日志取自 update_log.md 顶部当前版本段落。
// ============================================================================

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.nio.charset.StandardCharsets
import java.time.Duration

def modId = project.findProperty('mod_id')
def modVersion = project.findProperty('mod_version')
def gameVersion = project.findProperty('minecraft_version') ?: '1.21.1'
def userAgent = 'GoldenTweaks-Publisher/1.0 (github.com/Fodoth-jinzi89/GoldenTweaks)'

def credentialsFile = rootProject.file('publish-credentials.properties')
def changelogFile = rootProject.file('update_log.md')
def jarArchiveFile = tasks.named('jar').flatMap { it.archiveFile }.map { it.asFile }

def loadCredentials = {
    def props = new Properties()
    if (credentialsFile.exists()) {
        credentialsFile.withReader('UTF-8') { props.load(it) }
    }
    def pick = { String envName, String key ->
        def value = System.getenv(envName)
        if (value == null || value.trim().isEmpty()) {
            value = props.getProperty(key)
        }
        return value == null ? null : value.trim()
    }
    return [
            curseforgeApiKey   : pick('CURSEFORGE_API_KEY', 'curseforge_api_key'),
            curseforgeProjectId: pick('CURSEFORGE_PROJECT_ID', 'curseforge_project_id') ?: '1697081',
            modrinthToken      : pick('MODRINTH_TOKEN', 'modrinth_token'),
            modrinthProjectId  : pick('MODRINTH_PROJECT_ID', 'modrinth_project_id'),
            modrinthProjectSlug: pick('MODRINTH_PROJECT_SLUG', 'modrinth_project_slug') ?: modId,
    ]
}

def mustHave = { String value, String message ->
    if (value == null || value.isEmpty()) {
        throw new GradleException(message)
    }
    return value
}

def jarFile = {
    def file = jarArchiveFile.get()
    if (!file.exists()) {
        throw new GradleException("找不到构建产物，请先执行 gradlew build：${file}")
    }
    return file
}

def releaseChangelog = {
    def logFile = changelogFile
    if (!logFile.exists()) {
        return ''
    }
    def lines = logFile.getText('UTF-8').readLines()
    def start = lines.findIndexOf { it.startsWith('## ') }
    if (start < 0) {
        return ''
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    if (end < 0) {
        end = lines.size()
    }
    return lines[start..<end].join('\n').trim()
}

def newHttpClient = {
    HttpClient.newBuilder()
            .connectTimeout(Duration.ofSeconds(30))
            .followRedirects(HttpClient.Redirect.NEVER)
            .version(HttpClient.Version.HTTP_1_1)
            .build()
}

def sendForm = { HttpClient client, String method, String url, Map<String, String> headers, byte[] body, String boundary ->
    def builder = HttpRequest.newBuilder(URI.create(url))
            .timeout(Duration.ofMinutes(10))
            .header('Content-Type', "multipart/form-data; boundary=${boundary}")
            .header('User-Agent', userAgent)
            .method(method, HttpRequest.BodyPublishers.ofByteArray(body))
    headers.each { name, value -> builder.header(name, value) }
    return client.send(builder.build(), HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
}

def buildMultipart = { String boundary, List<Map> parts ->
    def out = new ByteArrayOutputStream()
    def write = { String text -> out.write(text.getBytes(StandardCharsets.UTF_8)) }
    parts.each { part ->
        write("--${boundary}\r\n")
        def disposition = "Content-Disposition: form-data; name=\"${part.name}\""
        if (part.filename) {
            disposition += "; filename=\"${part.filename}\""
        }
        write(disposition + "\r\n")
        if (part.contentType) {
            write("Content-Type: ${part.contentType}\r\n")
        }
        write("\r\n")
        out.write(part.content as byte[])
        write("\r\n")
    }
    write("--${boundary}--\r\n")
    return out.toByteArray()
}

def fetchModrinthProjects = { HttpClient client, String token ->
    def userRequest = HttpRequest.newBuilder(URI.create('https://api.modrinth.com/v2/user'))
            .header('User-Agent', userAgent)
            .header('Authorization', token)
            .GET()
            .build()
    def userResponse = client.send(userRequest, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
    if (!(userResponse.statusCode() in 200..299)) {
        throw new GradleException("Modrinth 校验 token 失败（${userResponse.statusCode()}）：${userResponse.body()}")
    }
    def userId = new JsonSlurper().parseText(userResponse.body()).id

    def listRequest = HttpRequest.newBuilder(URI.create("https://api.modrinth.com/v2/user/${userId}/projects"))
            .header('User-Agent', userAgent)
            .header('Authorization', token)
            .GET()
            .build()
    def listResponse = client.send(listRequest, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8))
    if (!(listResponse.statusCode() in 200..299)) {
        throw new GradleException("Modrinth 获取项目列表失败（${listResponse.statusCode()}）：${listResponse.body()}")
    }
    return new JsonSlurper().parseText(listResponse.body())
}

def resolveModrinthProjectId = { HttpClient client, String token, String configuredId, String slug ->
    if (configuredId != null && !configuredId.isEmpty()) {
        return configuredId
    }
    def projects = fetchModrinthProjects(client, token)
    def match = projects.find { it.slug == slug }
    if (match == null) {
        def listing = projects.collect { project -> "  - ${project.slug} (${project.id})".toString() }.join('\n')
        throw new GradleException("Modrinth 账号下找不到 slug 为 '${slug}' 的项目，请在 publish-credentials.properties 里设置 modrinth_project_id。\n当前账号项目：\n${listing}")
    }
    return match.id
}

tasks.register('modrinthProjects') {
    group = 'publishing'
    description = '列出 Modrinth token 账号下的全部项目（用于查找草稿项目的 ID）'
    doLast {
        def credentials = loadCredentials()
        def token = mustHave(credentials.modrinthToken, "缺少 Modrinth token，请填写 publish-credentials.properties 的 modrinth_token 或设置环境变量 MODRINTH_TOKEN")
        def projects = fetchModrinthProjects(newHttpClient(), token)
        projects.each { project ->
            logger.lifecycle("${project.slug}  id=${project.id}  title=${project.title}  status=${project.status ?: 'unknown'}")
        }
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = '把当前版本的 jar 上传到 Modrinth'
    dependsOn tasks.named('jar')
    doLast {
        def credentials = loadCredentials()
        def token = mustHave(credentials.modrinthToken, "缺少 Modrinth token，请填写 publish-credentials.properties 的 modrinth_token 或设置环境变量 MODRINTH_TOKEN")
        def client = newHttpClient()
        def projectId = resolveModrinthProjectId(client, token, credentials.modrinthProjectId, credentials.modrinthProjectSlug)
        def jar = jarFile()

        def payload = [
                name          : "GoldenTweaks ${modVersion}",
                version_number: modVersion,
                changelog     : releaseChangelog(),
                dependencies  : [],
                game_versions : [gameVersion],
                version_type  : 'release',
                loaders       : ['neoforge'],
                featured      : false,
                project_id    : projectId,
                file_parts    : [jar.name],
                primary_file  : jar.name,
        ]

        def boundary = "----GoldenTweaks${System.currentTimeMillis()}"
        def body = buildMultipart(boundary, [
                [name: 'data', content: JsonOutput.toJson(payload).getBytes(StandardCharsets.UTF_8), contentType: 'application/json'],
                [name: jar.name, filename: jar.name, content: jar.bytes, contentType: 'application/java-archive'],
        ])

        def response = sendForm(client, 'POST', 'https://api.modrinth.com/v2/version', [Authorization: token], body, boundary)
        if (!(response.statusCode() in 200..299)) {
            throw new GradleException("Modrinth 上传失败（${response.statusCode()}）：${response.body()}")
        }
        def result = new JsonSlurper().parseText(response.body())
        logger.lifecycle("Modrinth 上传成功：${result.version_number} -> https://modrinth.com/mod/${credentials.modrinthProjectSlug}/version/${result.version_number}")
    }
}

tasks.register('publishCurseForge') {
    group = 'publishing'
    description = '把当前版本的 jar 上传到 CurseForge'
    dependsOn tasks.named('jar')
    doLast {
        def credentials = loadCredentials()
        def apiKey = mustHave(credentials.curseforgeApiKey, "缺少 CurseForge API Key，请填写 publish-credentials.properties 的 curseforge_api_key 或设置环境变量 CURSEFORGE_API_KEY")
        def projectId = mustHave(credentials.curseforgeProjectId, "缺少 CurseForge 项目 ID")
        def jar = jarFile()
        def client = newHttpClient()

        def metadata = [
                changelog       : releaseChangelog(),
                changelogType   : 'markdown',
                displayName     : jar.name,
                gameVersionNames: [gameVersion, 'NeoForge', 'Client', 'Server'],
                releaseType     : 'release',
        ]

        def boundary = "----GoldenTweaks${System.currentTimeMillis()}"
        def body = buildMultipart(boundary, [
                [name: 'metadata', content: JsonOutput.toJson(metadata).getBytes(StandardCharsets.UTF_8), contentType: 'application/json'],
                [name: 'file', filename: jar.name, content: jar.bytes, contentType: 'application/java-archive'],
        ])

        def url = "https://minecraft.curseforge.com/api/projects/${projectId}/upload-file"
        def response = sendForm(client, 'POST', url, ['X-Api-Token': apiKey], body, boundary)
        if (!(response.statusCode() in 200..299)) {
            def detail = response.body() ?: ''
            if (detail.contains('Just a moment') || detail.contains('__cf_chl')) {
                throw new GradleException("CurseForge 上传被 Cloudflare 人机校验拦截（${response.statusCode()}）。请稍后重试，或登录网站手动上传。")
            }
            throw new GradleException("CurseForge 上传失败（${response.statusCode()}）：${detail}")
        }
        def result = new JsonSlurper().parseText(response.body())
        if (result.id == null) {
            throw new GradleException("CurseForge 返回了非预期响应（${response.statusCode()}）：${response.body()}")
        }
        logger.lifecycle("CurseForge 上传成功：${jar.name}（文件 id=${result.id}）")
    }
}

tasks.register('publishPlatforms') {
    group = 'publishing'
    description = '把当前版本的 jar 同时上传到 CurseForge 与 Modrinth'
    dependsOn 'publishCurseForge', 'publishModrinth'
}
