name: Build and Publish Mod

# 注意：本仓库不分发 libs/ 下的第三方模组 jar，因此 CI 无法编译本项目。
# 正式发布请本地执行 ./gradlew build，然后把 build/libs/*.jar 手动上传到 Release。
# 这里只保留手动触发，避免每次发 Release 都产生一次失败的构建。
on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        run: ./gradlew build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTweaks-Build
          path: build/libs/*.jar

      # 自动上传 release jar 到 GitHub Release
      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
